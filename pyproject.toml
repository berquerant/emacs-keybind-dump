[project]
name = "emacs-keybind-dump"
version = "0.1.0"
description = "Dump, analyze, filter, and search Emacs keybindings across keymaps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
keybind-dump = "keybind_dump.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keybind_dump"]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
