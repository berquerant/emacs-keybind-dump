[tools]
python = "3.14"
uv = "0.12.23"

[env]
PYTHONPATH = "src"

[tasks.dump]
description = "Dump Emacs keybindings to JSONL"
run = "uv run keybind-dump -f jsonl"

[tasks.test]
description = "Run tests with uv"
run = "uv run python -m unittest discover -s tests"

[tasks.cli]
description = "Run CLI with uv"
run = "uv run keybind-dump"
